<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ahmed Samy Store</title>
<style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#faf3e6;color:#3b2412}header{background:#4a2a15;color:#fff;padding:24px 16px;text-align:center}h1{margin:0;font-size:24px}header p{margin:6px 0 0;opacity:.85;font-size:14px}main{max-width:620px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px #0002;padding:16px;margin-bottom:16px}.top{display:flex;gap:14px;align-items:center}.top img{width:72px;height:72px;border-radius:16px;background:#eee}h2{margin:0;font-size:17px;line-height:1.5}small{color:#7a5a3a}p{line-height:1.8;font-size:15px}a.btn{display:block;text-align:center;background:#2e7d32;color:#fff;text-decoration:none;padding:13px;border-radius:12px;font-size:17px}details{margin-top:12px;font-size:13px;color:#5b4026}code{display:block;direction:ltr;word-break:break-all;background:#f3e9d6;padding:6px;border-radius:8px;font-size:11px}ol{padding-right:20px;line-height:1.9}.how{background:#fff8e1;border-radius:16px;padding:14px;font-size:14px}</style></head><body>
<header><h1 dir="ltr">Ahmed Samy Store</h1><p>تطبيقات أندرويد مجانية للتحميل المباشر</p></header>
<main><div id="list">جارٍ التحميل...</div>
<div class="how"><b>طريقة التثبيت</b><ol><li>افتح هذه الصفحة من Chrome على هاتف أندرويد.</li><li>اضغط "تحميل" ثم افتح الملف بعد انتهاء التحميل.</li><li>لو ظهرت رسالة أمان، اضغط "الإعدادات" وفعّل "السماح من هذا المصدر" ثم ارجع واضغط تثبيت.</li></ol></div></main>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('apps.json?t='+Date.now()).then(r=>r.json()).then(a=>{
  document.getElementById('list').innerHTML=a.map(x=>'<div class="card"><div class="top"><img src="'+esc(x.icon)+'" alt=""><div><h2>'+esc(x.name)+'</h2><small>الإصدار '+esc(x.version)+' · '+esc(x.size)+' · مجاني</small></div></div><p>'+esc(x.desc)+'</p><a class="btn" href="'+esc(x.apk)+'" download>تحميل</a>'+(x.sha256?'<details><summary>التحقق من الملف</summary><code>SHA-256: '+esc(x.sha256)+'</code></details>':'')+'</div>').join('')||'لا توجد تطبيقات بعد.';
}).catch(()=>{document.getElementById('list').textContent='تعذّر التحميل، حاول مرة أخرى.';});
</script></body></html>
